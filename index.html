<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20302a" />
    <meta name="description" content="Pocketroom — everything you need for today, in one little place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Pocketroom — Today’s Room</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="stage" aria-label="Today’s Room"></main>
      <aside id="task-dock" aria-label="Today's tasks"></aside>
      <section id="music-player" aria-label="Music player"></section>
      <div id="sheet-root"></div>
      <div id="toast-root" aria-live="polite" aria-atomic="false"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
